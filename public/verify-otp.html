<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Identity | HunarHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/toasts.js"></script>
    <style>
        body { background-color: var(--bg-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .verify-card { border-radius: 24px; border: none; overflow: hidden; }
        .otp-input { 
            letter-spacing: 16px; 
            font-size: 2.5rem; 
            font-weight: 800; 
            text-align: center; 
            color: var(--primary-color); 
            height: 80px;
            border-width: 2px;
            border-radius: var(--radius-md);
        }
        .otp-input:focus { letter-spacing: 16px; }
        .otp-input::placeholder { font-weight: 400; color: #cbd5e1; letter-spacing: 16px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card verify-card shadow-lg text-center animate-slide-up bg-white">
                    <div class="bg-primary pt-5 pb-4 px-4 text-white position-relative overflow-hidden">
                        <div class="position-absolute top-0 start-0 w-100 h-100" style="background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0) 60%);"></div>
                        <div class="position-relative z-index-1">
                            <i class="bi bi-shield-lock-fill mb-3 d-inline-block" style="font-size: 3.5rem; color: var(--accent-color);"></i>
                            <h2 class="fw-bold mb-0 text-white">Security Check</h2>
                        </div>
                    </div>
                    
                    <div class="p-4 p-md-5">
                        <p class="text-muted mb-4 fs-5">We've sent a 6-digit code. Please enter it below to activate your account.</p>
                        
                        <form id="verifyForm">
                            <div class="mb-4">
                                <input type="text" id="otpInput" class="form-control otp-input border-primary bg-main" 
                                    maxlength="6" placeholder="------" required autocomplete="one-time-code" autofocus>
                            </div>
                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-primary btn-lg py-3 shadow-sm" id="verifyBtn">
                                    Verify & Activate
                                </button>
                                <button type="button" class="btn btn-outline-secondary py-2" id="resendBtn">
                                    <i class="bi bi-arrow-clockwise me-2"></i>Didn't get it? Resend Code
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer bg-transparent border-0 pb-4">
                        <a href="register.html" class="text-muted text-decoration-none fw-medium"><i class="bi bi-arrow-left me-2"></i>Return to setup</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container included via script, usually injected dynamically but keep just in case -->
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script>
        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp_code = document.getElementById('otpInput').value;
            const btn = document.getElementById('verifyBtn');

            if (otp_code.length !== 6) return showToast('Please enter the full 6-digit code', 'error');

            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Checking...';

            try {
                const response = await fetch('/api/register/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ otp_code })
                });

                const res = await response.json();
                if (response.ok) {
                    showToast('Account activated! You explore now.', 'success');
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-success');
                    btn.innerHTML = '<i class="bi bi-check-lg me-2"></i>Verified!';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    showToast(res.error || 'Verification failed. Code might be expired.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch (err) {
                console.error(err);
                showToast('Connection error. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        document.getElementById('resendBtn').addEventListener('click', async () => {
            const btn = document.getElementById('resendBtn');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';
            showToast('Requesting new code...', 'info');
            
            try {
                const response = await fetch('/api/otp/resend', { method: 'POST' });
                const res = await response.json();
                if (response.ok) {
                    showToast('New code sent! Check your inbox.', 'success');
                    // Add cool down
                    let countdown = 60;
                    const timer = setInterval(() => {
                        btn.innerHTML = `Wait ?{countdown}s`;
                        countdown--;
                        if (countdown < 0) {
                            clearInterval(timer);
                            btn.disabled = false;
                            btn.innerHTML = originalText;
                        }
                    }, 1000);
                } else {
                    showToast(res.error || 'Failed to resend code', 'error');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch (err) {
                showToast('Error requesting new code', 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
