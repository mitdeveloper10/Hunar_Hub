<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | HunarHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/style.css" rel="stylesheet">
    <script src="/js/toasts.js"></script>
    <style>
        .split-layout { min-height: 100vh; display: flex; }
        .split-brand {
            width: 45%;
            background: linear-gradient(135deg, var(--clr-dark) 0%, var(--clr-primary) 100%);
            color: white;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .split-brand::before {
            content: ''; position: absolute; top: -20%; left: -20%; width: 60%; height: 60%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); border-radius: 50%;
        }
        .split-form {
            width: 55%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 2rem;
            position: relative;
        }
        .auth-container { max-width: 450px; width: 100%; opacity: 0; animation: slideUp 0.6s forwards; }
        
        @media (max-width: 991px) {
            .split-layout { flex-direction: column; }
            .split-brand { width: 100%; padding: 3rem 2rem; min-height: 300px; text-align: center; justify-content: center; }
            .split-form { width: 100%; padding: 3rem 1rem; }
            .brand-logo { justify-content: center; }
        }

        .back-link {
            position: absolute; top: 2rem; right: 2rem; color: var(--text-muted); text-decoration: none; font-weight: 500; transition: var(--transition-fast);
        }
        .back-link:hover { color: var(--primary-color); transform: translateX(-5px); }
    </style>
</head>

<body>
    <div class="split-layout">
        <div class="split-brand">
            <nav class="navbar navbar-expand-lg absolute-top py-4 px-4 px-lg-0">
                <div class="container d-flex justify-content-between align-items-center">
                    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white mb-0" href="/">
                        <div class="bg-primary text-white rounded d-flex align-items-center justify-content-center shadow-sm" style="width: 32px; height: 32px; color: white !important;">
                            <i class="bi bi-layers-half"></i>
                        </div>
                        HunarHub<span class="text-white opacity-50">.</span>
                    </a>
                </div>
            </nav>
            <div class="position-relative z-index-1 mt-5">
                <h1 class="display-5 fw-bold mb-4">Secure Account Recovery</h1>
                <p class="lead" style="color: #A69080;">Enter your registered email address and we'll send you a 6-digit code to securely regain access to your storefront or customer profile.</p>
            </div>
        </div>

        <div class="split-form">
            <a href="/login.html" class="back-link d-none d-md-flex align-items-center gap-2"><i class="bi bi-arrow-left"></i> Sign In</a>
            
            <div class="auth-container">
                <div class="mb-5">
                    <h3 class="fw-bold text-heading mb-1">Forgot Password</h3>
                    <p class="text-muted small">We'll help you get back into your account.</p>
                </div>
                
                <form id="forgotForm">
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted text-uppercase mb-2" style="letter-spacing: 0.1em;">Registered Email</label>
                        <div class="input-group glass-pane border rounded-lg shadow-sm overflow-hidden">
                            <span class="input-group-text bg-transparent border-0 ps-3 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" id="emailInput" class="form-control border-0 bg-transparent shadow-none py-2" placeholder="name@example.com" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-3 shadow-lg mb-4" id="submitBtn">
                        Send Recovery Code <i class="bi bi-arrow-right-short ms-1"></i>
                    </button>
                    
                    <div class="text-center">
                        <p class="text-muted small mb-0">Remembered your password? <a href="/login.html" class="text-primary fw-bold text-decoration-none ms-1">Sign In</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            const email = document.getElementById('emailInput').value;

            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/password/forgot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();
                if (response.ok) {
                    showToast('Recovery code sent successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = `/reset-password.html?email=${encodeURIComponent(email)}`;
                    }, 1500);
                } else {
                    showToast(result.error || 'Failed to send recovery code', 'error');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                showToast('A network error occurred', 'error');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
