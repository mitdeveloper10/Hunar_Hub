<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | HunarHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/toasts.js"></script>
    <style>
        body { background-color: var(--bg-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .verify-card { border-radius: 24px; border: none; overflow: hidden; }
        .otp-input { 
            letter-spacing: 16px; 
            font-size: 2.5rem; 
            font-weight: 800; 
            text-align: center; 
            color: var(--primary-color); 
            height: 80px;
            border-width: 2px;
            border-radius: var(--radius-md);
        }
        .otp-input:focus { letter-spacing: 16px; }
        .otp-input::placeholder { font-weight: 400; color: #cbd5e1; letter-spacing: 16px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card verify-card shadow-lg animate-slide-up bg-white">
                    <div class="bg-primary pt-5 pb-4 px-4 text-white position-relative overflow-hidden text-center">
                        <div class="position-absolute top-0 start-0 w-100 h-100" style="background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0) 60%);"></div>
                        <div class="position-relative z-index-1">
                            <i class="bi bi-key-fill mb-3 d-inline-block" style="font-size: 3.5rem; color: var(--accent-color);"></i>
                            <h2 class="fw-bold mb-0 text-white">Create New Password</h2>
                        </div>
                    </div>
                    
                    <div class="p-4 p-md-5">
                        <p class="text-muted mb-4 text-center">We've sent a 6-digit code to your email. Enter it below along with your new password.</p>
                        
                        <form id="resetForm">
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Security Code</label>
                                <input type="text" id="otpInput" class="form-control otp-input border-primary bg-main mb-2" 
                                    maxlength="6" placeholder="------" required autocomplete="one-time-code" autofocus>
                                <div class="text-end">
                                    <button type="button" class="btn btn-link btn-sm text-decoration-none p-0" id="resendBtn">Resend Code</button>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">New Password</label>
                                <div class="input-group glass-pane border rounded-lg shadow-sm overflow-hidden">
                                    <span class="input-group-text bg-transparent border-0 ps-3 text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="newPassword" class="form-control border-0 bg-transparent shadow-none py-2" placeholder="••••••••" required>
                                </div>
                                <div class="form-text small mt-2">At least 8 characters, 1 uppercase, 1 number, and 1 special character.</div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Confirm Password</label>
                                <div class="input-group glass-pane border rounded-lg shadow-sm overflow-hidden">
                                    <span class="input-group-text bg-transparent border-0 ps-3 text-muted"><i class="bi bi-check-circle"></i></span>
                                    <input type="password" id="confirmPassword" class="form-control border-0 bg-transparent shadow-none py-2" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="d-grid mt-2">
                                <button type="submit" class="btn btn-primary btn-lg py-3 shadow-sm" id="submitBtn">
                                    Update Password
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer bg-transparent border-0 pb-4 text-center">
                        <a href="login.html" class="text-muted text-decoration-none fw-medium"><i class="bi bi-arrow-left me-2"></i>Back to login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');

        if (!email) {
            showToast('No recovery email found. Redirecting...', 'error');
            setTimeout(() => window.location.href = 'forgot-password.html', 2000);
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp_code = document.getElementById('otpInput').value;
            const new_password = document.getElementById('newPassword').value;
            const confirm_password = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');

            if (otp_code.length !== 6) return showToast('Please enter the full 6-digit code', 'error');
            if (new_password !== confirm_password) return showToast('Passwords do not match!', 'error');

            const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            if (!passwordRegex.test(new_password)) {
                return showToast('Password is too weak. Please meet all requirements.', 'error');
            }

            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Updating...';

            try {
                const response = await fetch('/api/password/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp_code, new_password })
                });

                const res = await response.json();
                if (response.ok) {
                    showToast('Password updated successfully! Redirecting...', 'success');
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-success');
                    btn.innerHTML = '<i class="bi bi-check-lg me-2"></i>Updated!';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    showToast(res.error || 'Failed to reset password. Code may be expired.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch (err) {
                console.error(err);
                showToast('Connection error. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        document.getElementById('resendBtn').addEventListener('click', async () => {
            if (!email) return;
            const btn = document.getElementById('resendBtn');
            const originalText = btn.innerHTML;
            
            btn.style.pointerEvents = 'none';
            btn.innerHTML = 'Sending...';
            
            try {
                // Uses the same generic resend implementation or a new one
                const response = await fetch('/api/password/forgot', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const res = await response.json();
                if (response.ok) {
                    showToast('New recovery code sent to your email.', 'success');
                    let countdown = 60;
                    const timer = setInterval(() => {
                        btn.innerHTML = `Wait ${countdown}s`;
                        countdown--;
                        if (countdown < 0) {
                            clearInterval(timer);
                            btn.style.pointerEvents = 'auto';
                            btn.innerHTML = originalText;
                        }
                    }, 1000);
                } else {
                    showToast(res.error || 'Failed to resend code', 'error');
                    btn.style.pointerEvents = 'auto';
                    btn.innerHTML = originalText;
                }
            } catch (err) {
                showToast('Error requesting new code', 'error');
                btn.style.pointerEvents = 'auto';
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
